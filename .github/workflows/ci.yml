name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:test
      - run: npm run client:payload
      - name: Build the Windows zip (not uploaded)
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
